# ---------------------------------------------------------------------------
# Edge: API gateway + frontend (exposed via NodePort on kind)
# ---------------------------------------------------------------------------
apiGateway:
  deploymentname: api-gateway-deployment
  servicename: api-gateway
  image: banking/api-gateway:dev
  replicas: 1
  port: 8080
  serviceType: NodePort
  nodePort: 30080
  corsAllowedOrigins: "*"
  hpa: api-gateway-hpa
  minReplicas: 1
  maxReplicas: 5

frontend:
  deploymentname: frontend-deployment
  servicename: frontend
  image: banking/frontend:dev
  replicas: 1
  port: 8080
  serviceType: NodePort
  nodePort: 30081
  hpa: frontend-hpa
  minReplicas: 1
  maxReplicas: 4

# ---------------------------------------------------------------------------
# In-cluster PostgreSQL (Redis/Kafka defined above)
# ---------------------------------------------------------------------------
postgres:
  name: postgres
  servicename: postgres
  image: postgres:16-alpine
  port: 5432
  storage: 2Gi
  storageClass: ""

# ---------------------------------------------------------------------------
# Ingress (Traefik) + TLS (cert-manager) — Phase 11. Disabled by default;
# kind uses the NodePorts above. Set enabled/tls/host for EKS.
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: traefik
  host: vijaygiduthuri.in
  tls: false # Phase E flips this to true (cert-manager auto-issues banking-tls)
  tlsSecretName: banking-tls
  clusterIssuer: letsencrypt-prod
